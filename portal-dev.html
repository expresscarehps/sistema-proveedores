<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Proveedores - Subir Factura</title>
<style>
  :root {
    --azul: #0b5d85;
    --azul-claro: #0e7bab;
    --rojo-ec: #e3241a;
    --gris: #f4f6f8;
    --texto: #22303f;
    --borde: #d5dce3;
    --verde: #1e6b3a;
    --rojo: #a3272c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--gris);
    margin: 0;
    padding: 24px 16px;
    color: var(--texto);
  }
  .contenedor {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 0 30px 32px 30px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    overflow: hidden;
  }
  .liston {
    height: 5px;
    margin: 0 -30px;
    background: linear-gradient(to right, var(--azul) 0%, var(--azul) 47%, var(--rojo-ec) 53%, var(--rojo-ec) 100%);
  }
  .mira {
    position: absolute;
    width: 16px; height: 16px;
    border: 2px solid var(--azul-claro);
    opacity: 0.45;
    pointer-events: none;
  }
  .mira.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .mira.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .mira.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .mira.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  .eyebrow {
    font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--azul-claro); font-weight: 700; margin: 22px 0 6px 0;
    font-family: "SF Mono", "Courier New", monospace;
  }
  h1 { font-size: 1.4rem; color: var(--azul); margin: 0 0 4px 0; }
  p.subtitulo { color: #5b6b7a; margin: 0 0 20px 0; font-size: 0.92rem; }
  .tarjeta-proveedor {
    background: var(--gris); border-radius: 10px; padding: 14px 16px; margin-bottom: 22px;
    font-size: 0.9rem;
  }
  .tarjeta-proveedor b { color: var(--azul); }

  label { display: block; font-size: 0.9rem; font-weight: 600; margin-top: 16px; margin-bottom: 6px; }
  select, input[type="file"] {
    width: 100%; padding: 11px 12px; border: 1px solid var(--borde);
    border-radius: 8px; font-size: 0.95rem; font-family: inherit; background: #fff;
  }
  .ayuda-archivo { font-size: 0.8rem; color: #8b98a5; margin-top: 4px; }

  button {
    width: 100%; margin-top: 26px; padding: 13px; background: var(--azul);
    color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button:hover:not(:disabled) { background: var(--azul-claro); }

  .mensaje { margin-top: 18px; padding: 14px; border-radius: 8px; font-size: 0.9rem; display: none; }
  .mensaje.exito { background: #e7f6ec; color: #1e6b3a; display: block; }
  .mensaje.error { background: #fbe9e9; color: #a3272c; display: block; }

  .seccion-historial { margin-top: 34px; padding-top: 24px; border-top: 1px solid var(--borde); }
  .seccion-historial h2 { font-size: 1.05rem; color: var(--azul); margin: 0 0 14px 0; }
  .factura-item {
    background: var(--gris); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; font-size: 0.85rem;
  }
  .factura-item .fila { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .factura-item .folio { font-weight: 700; color: var(--texto); }
  .estatus-badge {
    display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: 0.72rem; font-weight: 700;
  }
  .estatus-badge.pendiente { background: #fff4d9; color: #8a6900; }
  .estatus-badge.validada { background: #e7f6ec; color: #1e6b3a; }
  .estatus-badge.rechazada { background: #fbe9e9; color: #a3272c; }
  .alerta-mini { color: var(--rojo); font-size: 0.78rem; margin-top: 4px; }

  .tarjeta-complemento {
    background: #fff8e6; border: 1px solid #f0d98c; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
  }
  .tarjeta-complemento.vencido { background: #fbe9e9; border-color: #f3c2c2; }
  .tarjeta-complemento .fila-datos { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 0.88rem; margin-bottom: 10px; }
  .tarjeta-complemento .limite { font-weight: 700; }
  .tarjeta-complemento .limite.vencido-texto { color: var(--rojo); }
  .fila-archivos-complemento { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fila-archivos-complemento input[type="file"] { flex: 1; min-width: 140px; font-size: 0.8rem; padding: 6px; border: 1px solid var(--borde); border-radius: 6px; }
  .btn-subir-complemento {
    padding: 9px 16px; background: var(--azul); color: #fff; border: none; border-radius: 6px;
    font-weight: 600; cursor: pointer; font-size: 0.85rem; white-space: nowrap;
  }
  .vacio-historial { text-align: center; color: #8b98a5; padding: 20px 0; font-size: 0.88rem; }

  .pantalla-error {
    text-align: center; padding: 40px 20px; color: var(--rojo);
  }
</style>
</head>
<body>

<div class="contenedor">
  <div class="mira tl"></div>
  <div class="mira tr"></div>
  <div class="mira bl"></div>
  <div class="mira br"></div>
  <div class="liston"></div>

  <div id="cargando" style="text-align:center; padding:40px 0; color:#8b98a5;">Cargando tu información...</div>

  <div id="pantallaError" class="pantalla-error" style="display:none;">
    <p id="mensajeError"></p>
  </div>

  <div id="panelPrincipal" style="display:none;">
    <p class="eyebrow">Portal de proveedores</p>
    <h1>Subir Factura</h1>
    <p class="subtitulo">Sube tu factura, el XML, y la evidencia de entrega firmada y sellada.</p>

    <div class="tarjeta-proveedor">
      <b id="nombreProveedor"></b><br>
      RFC: <span id="rfcProveedor"></span>
    </div>

    <form id="formFactura">
      <div id="campoEmpresa"></div>

      <label>Factura (PDF) *</label>
      <input type="file" id="facturaPdf" accept="application/pdf" required>

      <label>XML de la factura *</label>
      <input type="file" id="facturaXml" accept=".xml,text/xml" required>
      <div class="ayuda-archivo">El sistema lee el monto, fecha y folio fiscal directo de este archivo.</div>

      <label>Evidencia de entrega (foto o escaneo firmado y sellado) *</label>
      <input type="file" id="evidencia" accept="image/*,application/pdf" required>

      <button type="submit" id="btnEnviar">Subir factura</button>
    </form>

    <div id="mensaje" class="mensaje"></div>

    <div id="seccionComplementos" style="display:none;" class="seccion-historial">
      <h2>Complementos de Pago pendientes</h2>
      <div id="listaComplementos"></div>
    </div>

    <div class="seccion-historial">
      <h2>Tus facturas</h2>
      <div id="listaFacturas"></div>
    </div>
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzyqEFg0vlivJaHSpdwh00-ZamquUDabqVxs1C7RsfvhCFkMl3KCWZuHSjdtnLeHlMdXw/exec';

  function esperarMinimo(promesa, msMinimo) {
    return Promise.all([promesa, new Promise(r => setTimeout(r, msMinimo))]).then(([resultado]) => resultado);
  }

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  let empresaProveedor = '';

  async function iniciar() {
    if (!token) {
      mostrarError('Este link no es válido. Verifica que copiaste la dirección completa del correo que te mandamos.');
      return;
    }

    try {
      const resp = await fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({ action: 'obtenerInfoProveedor', token: token })
      });
      const resultado = await resp.json();

      if (!resultado.ok) {
        mostrarError(resultado.error || 'No se pudo cargar tu información.');
        return;
      }

      empresaProveedor = resultado.proveedor.empresa;
      document.getElementById('nombreProveedor').textContent = resultado.proveedor.nombre;
      document.getElementById('rfcProveedor').textContent = resultado.proveedor.rfc;
      pintarCampoEmpresa(empresaProveedor);

      document.getElementById('cargando').style.display = 'none';
      document.getElementById('panelPrincipal').style.display = 'block';

      cargarFacturas();
      cargarComplementosPendientes();
    } catch (err) {
      mostrarError('No se pudo conectar con el sistema. Intenta más tarde.');
    }
  }

  function mostrarError(texto) {
    document.getElementById('cargando').style.display = 'none';
    document.getElementById('mensajeError').textContent = texto;
    document.getElementById('pantallaError').style.display = 'block';
  }

  function pintarCampoEmpresa(empresa) {
    const contenedor = document.getElementById('campoEmpresa');
    if (empresa === 'AMBAS') {
      contenedor.innerHTML = `
        <label>¿A qué empresa corresponde esta factura? *</label>
        <select id="empresaFactura" required>
          <option value="">Selecciona...</option>
          <option value="KARALV">KARALV (Express Care by Valvoline)</option>
          <option value="VENTURA">Ventura Distribución y Servicios</option>
        </select>
      `;
    } else {
      const nombreEmpresa = empresa === 'KARALV' ? 'KARALV (Express Care by Valvoline)' : 'Ventura Distribución y Servicios';
      contenedor.innerHTML = `
        <label>Empresa</label>
        <div class="tarjeta-proveedor" style="margin-bottom:0;">${nombreEmpresa}</div>
        <input type="hidden" id="empresaFactura" value="${empresa}">
      `;
    }
  }

  function archivoABase64(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => {
        const resultado = lector.result;
        const base64 = resultado.split(',')[1];
        resolve(base64);
      };
      lector.onerror = reject;
      lector.readAsDataURL(file);
    });
  }

  function archivoATexto(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => resolve(lector.result);
      lector.onerror = reject;
      lector.readAsText(file);
    });
  }

  document.getElementById('formFactura').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnEnviar');
    const mensaje = document.getElementById('mensaje');
    const colorNormalBtn = getComputedStyle(document.documentElement).getPropertyValue('--azul').trim();
    btn.disabled = true;
    btn.textContent = '⏳ Subiendo...';
    btn.style.background = '#9aa5ad';
    mensaje.style.display = 'none';

    try {
      const empresaFactura = document.getElementById('empresaFactura').value;
      const facturaPdfFile = document.getElementById('facturaPdf').files[0];
      const facturaXmlFile = document.getElementById('facturaXml').files[0];
      const evidenciaFile = document.getElementById('evidencia').files[0];

      if (!empresaFactura || !facturaPdfFile || !facturaXmlFile || !evidenciaFile) {
        throw new Error('Completa todos los campos antes de enviar.');
      }

      const [facturaPdfBase64, xmlTexto, evidenciaBase64] = await Promise.all([
        archivoABase64(facturaPdfFile),
        archivoATexto(facturaXmlFile),
        archivoABase64(evidenciaFile)
      ]);

      const datos = {
        action: 'registrarFactura',
        token: token,
        empresaFactura: empresaFactura,
        facturaPdfBase64: facturaPdfBase64,
        facturaPdfNombre: facturaPdfFile.name,
        xmlTexto: xmlTexto,
        xmlNombre: facturaXmlFile.name.replace(/\.xml$/i, ''),
        evidenciaBase64: evidenciaBase64,
        evidenciaNombre: evidenciaFile.name,
        evidenciaMimeType: evidenciaFile.type || 'image/jpeg'
      };

      const resp = await esperarMinimo(fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify(datos)
      }), 600);
      const resultado = await resp.json();

      if (resultado.ok) {
        mensaje.className = 'mensaje exito';
        mensaje.textContent = 'Factura recibida correctamente (folio ' + resultado.folio + '). Queda pendiente de validación.';
        document.getElementById('formFactura').reset();
        pintarCampoEmpresa(empresaProveedor);
        cargarFacturas();
      } else {
        mensaje.className = 'mensaje error';
        mensaje.textContent = resultado.error || 'Ocurrió un error, intenta de nuevo.';
      }
    } catch (err) {
      mensaje.className = 'mensaje error';
      mensaje.textContent = err.message || 'No se pudo subir la factura. Intenta más tarde.';
    }

    mensaje.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Subir factura';
    btn.style.background = colorNormalBtn;
  });

  async function cargarFacturas() {
    try {
      const resp = await fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({ action: 'listarFacturasProveedor', token: token })
      });
      const resultado = await resp.json();
      if (!resultado.ok) return;
      pintarFacturas(resultado.facturas);
    } catch (err) {
      // Si falla el historial, no interrumpimos el resto de la página.
    }
  }

  function claseEstatus(estatus) {
    if (estatus === 'Validada') return 'validada';
    if (estatus === 'Rechazada') return 'rechazada';
    return 'pendiente';
  }

  function pintarFacturas(facturas) {
    const lista = document.getElementById('listaFacturas');
    if (!facturas || facturas.length === 0) {
      lista.innerHTML = '<div class="vacio-historial">Todavía no has subido ninguna factura.</div>';
      return;
    }

    lista.innerHTML = facturas.slice().reverse().map(f => `
      <div class="factura-item">
        <div class="fila">
          <span class="folio">${f.folioRegistro}</span>
          <span class="estatus-badge ${claseEstatus(f.estatus)}">${f.estatus}</span>
        </div>
        <div class="fila" style="margin-top:6px; color:#5b6b7a;">
          <span>Monto: $${Number(f.monto).toLocaleString('es-MX', {minimumFractionDigits:2})}</span>
          <span>Vence: ${new Date(f.vencimiento).toLocaleDateString('es-MX')}</span>
        </div>
        ${f.alertaRFC ? `<div class="alerta-mini">⚠ ${f.alertaRFC}</div>` : ''}
      </div>
    `).join('');
  }

  // ====== COMPLEMENTOS DE PAGO PENDIENTES ======

  async function cargarComplementosPendientes() {
    try {
      const resp = await fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({ action: 'listarComplementosPendientes', token: token })
      });
      const resultado = await resp.json();
      if (!resultado.ok) return;
      pintarComplementosPendientes(resultado.pendientes);
    } catch (err) {
      // Si esto falla, no interrumpimos el resto de la página.
    }
  }

  function pintarComplementosPendientes(pendientes) {
    const seccion = document.getElementById('seccionComplementos');
    const contenedor = document.getElementById('listaComplementos');

    if (!pendientes || pendientes.length === 0) {
      seccion.style.display = 'none';
      return;
    }
    seccion.style.display = 'block';

    const hoy = new Date();
    contenedor.innerHTML = pendientes.map(p => {
      const fechaLimite = new Date(p.fechaLimite);
      const vencido = fechaLimite < hoy;
      return `
        <div class="tarjeta-complemento ${vencido ? 'vencido' : ''}">
          <div class="fila-datos">
            <span>Factura <b>${p.referenciaFactura}</b> — $${Number(p.montoAbonado).toLocaleString('es-MX', {minimumFractionDigits:2})}</span>
            <span class="limite ${vencido ? 'vencido-texto' : ''}">${vencido ? '⚠ Venció el' : 'Fecha límite:'} ${fechaLimite.toLocaleDateString('es-MX')}</span>
          </div>
          <div class="fila-archivos-complemento">
            <div style="flex:1; min-width:140px;">
              <label style="display:block; font-size:0.75rem; font-weight:600; color:#5b6b7a; margin-bottom:4px;">XML del complemento</label>
              <input type="file" id="complementoXml-${p.idAbono}" accept=".xml,text/xml" style="width:100%;">
            </div>
            <div style="flex:1; min-width:140px;">
              <label style="display:block; font-size:0.75rem; font-weight:600; color:#5b6b7a; margin-bottom:4px;">PDF del complemento</label>
              <input type="file" id="complementoPdf-${p.idAbono}" accept="application/pdf" style="width:100%;">
            </div>
            <button class="btn-subir-complemento" id="btnSubirComplemento-${p.idAbono}" onclick="subirComplemento('${p.idAbono}')" style="align-self:flex-end;">Subir</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function subirComplemento(idAbono) {
    const xmlInput = document.getElementById('complementoXml-' + idAbono);
    const pdfInput = document.getElementById('complementoPdf-' + idAbono);
    const xmlFile = xmlInput.files[0];
    const pdfFile = pdfInput.files[0];

    if (!xmlFile || !pdfFile) {
      alert('Sube el XML y el PDF del complemento antes de continuar.');
      return;
    }

    const btn = document.getElementById('btnSubirComplemento-' + idAbono);
    const colorNormalBtn = getComputedStyle(document.documentElement).getPropertyValue('--azul').trim();
    btn.disabled = true;
    btn.textContent = '⏳ Subiendo...';
    btn.style.background = '#9aa5ad';

    try {
      const [xmlTexto, pdfBase64] = await esperarMinimo(Promise.all([
        archivoATexto(xmlFile),
        archivoABase64(pdfFile)
      ]), 500);

      const resp = await fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({
          action: 'subirComplementoPago', token: token, idAbono: idAbono,
          xmlTexto: xmlTexto, pdfBase64: pdfBase64
        })
      });
      const resultado = await resp.json();

      if (resultado.ok) {
        alert('Complemento recibido correctamente. ¡Gracias!');
        cargarComplementosPendientes();
      } else {
        alert(resultado.error || 'Ocurrió un error al subir el complemento.');
        btn.disabled = false;
        btn.textContent = 'Subir';
        btn.style.background = colorNormalBtn;
      }
    } catch (err) {
      alert('No se pudo subir el complemento. Detalle: ' + (err && err.message ? err.message : 'error desconocido'));
      btn.disabled = false;
      btn.textContent = 'Subir';
      btn.style.background = colorNormalBtn;
    }
  }

  iniciar();
</script>

</body>
</html>
